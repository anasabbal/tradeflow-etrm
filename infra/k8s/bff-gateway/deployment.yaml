apiVersion: apps/v1
kind: Deployment
metadata:
  name: bff-gateway
  labels:
    app: bff-gateway
spec:
  replicas: 1
  selector:
    matchLabels:
      app: bff-gateway
  template:
    metadata:
      labels:
        app: bff-gateway
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/path: /actuator/prometheus
        prometheus.io/port: "8080"
    spec:
      containers:
        - name: bff-gateway
          image: tradeflow/bff-gateway:local   # TODO: ECR URL + tag bumped by the GitOps pipeline
          ports:
            - containerPort: 8080
          envFrom:
            - configMapRef:
                name: bff-gateway
          readinessProbe:
            httpGet:
              path: /actuator/health
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /actuator/health
              port: 8080
            initialDelaySeconds: 60
            periodSeconds: 20
          resources:
            requests: {cpu: 250m, memory: 512Mi}
            limits: {cpu: 500m, memory: 1Gi}
