spring:
  application:
    name: settlement-service
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/tradeflow?currentSchema=settlements}
    username: ${SPRING_DATASOURCE_USERNAME:tradeflow}
    password: ${SPRING_DATASOURCE_PASSWORD:tradeflow}
  kafka:
    bootstrap-servers: ${SPRING_KAFKA_BOOTSTRAP_SERVERS:localhost:19092}

server:
  port: 8084

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
